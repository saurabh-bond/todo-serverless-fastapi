AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: A sample todo application using FastAPI + Mangum serverless stack with Cognito authentication

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, stage, prod]

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12

Resources:
  # 1. AWS HTTP API Gateway
  FastAPIHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Env

  # 2. DynamoDB table for todo records
  TodoDynamoDBTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "${Env}-todos-table"
      PrimaryKey:
        Name: todo_id
        Type: String

  # 3. Cognito user pool for login and user authentication
  TodoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Env}-todo-serverless-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  TodoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${Env}-todo-serverless-client"
      UserPoolId: !Ref TodoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # 4. Lambda function hosting the FastAPI app
  FastAPILambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.main.handler
      Environment:
        Variables:
          ENVIRONMENT: !Ref Env
          DYNAMODB_TABLE: !Ref TodoDynamoDBTable
          STAGE_PATH: !Sub "/${Env}"
          COGNITO_USER_POOL_ID: !Ref TodoUserPool
          COGNITO_APP_CLIENT_ID: !Ref TodoUserPoolClient
          COGNITO_REGION: !Ref AWS::Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodoDynamoDBTable
        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:SignUp
              - cognito-idp:InitiateAuth
            Resource: !GetAtt TodoUserPool.Arn
      Events:
        ProxyRoute:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref FastAPIHttpApi
        RootRoute:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref FastAPIHttpApi

Outputs:
  ApiUrl:
    Description: "API Gateway public endpoint URL"
    Value: !Sub "https://${FastAPIHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}/"
  UserPoolId:
    Description: "Cognito user pool ID"
    Value: !Ref TodoUserPool
  UserPoolClientId:
    Description: "Cognito app client ID"
    Value: !Ref TodoUserPoolClient

