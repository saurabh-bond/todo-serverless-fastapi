name: Deploy Development Backend

on: 
    push: 
        branches: 
            - dev # Triggers deployment to development on merge to dev

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout Source Code
              uses: actions/checkout@v3
            
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.12'
            
            - name: Install AWS SAM CLI
              uses: aws-actions/setup-sam@v2

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
                aws-region: us-east-1
            
            - name: SAM Build Project
              run: sam build --use-container

            - name: Ensure SAM deployment bucket exists
              run: |
                aws s3api head-bucket --bucket todo-serverless-fastapi-sam-deployments-dev --region us-east-1 2>/dev/null || \
                aws s3api create-bucket --bucket todo-serverless-fastapi-sam-deployments-dev --region us-east-1

            - name: SAM Deploy to Dev Stage
              run: |
                sam deploy --config-env dev --no-fail-on-empty-changeset